[package]
name = "retro-inventory"
version = "0.1.0"
edition = "2024"
readme = "README.md"

[dependencies]
axum = { version = "0.8.9", features = ["macros", "ws"] }
dotenvy = "0.15.7"
duckdb = { version = "1.10505.0", features = ["bundled"] }
mime_guess = "2.0.5"
rust-embed = "8.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter", "json"] }
